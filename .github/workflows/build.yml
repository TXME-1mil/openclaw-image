name: Build image

# Builds and pushes ghcr.io/txme-1mil/openclaw-image on tags shaped
# `openclaw-image/vN`. (Package name matches the repo so it lives in a
# fresh GHCR namespace — the legacy ghcr.io/txme-1mil/openclaw package
# is still linked to the private ac repo and can't accept pushes from
# here.) Triggered manually via workflow_dispatch as well.

on:
  push:
    tags:
      - "openclaw-image/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to push (e.g. v3 or v3-rc1)"
        required: true
        default: "latest"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            # Strip the "openclaw-image/" prefix from the git tag.
            echo "value=${GITHUB_REF_NAME#openclaw-image/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Fly machines run linux/amd64 — arm64 would just double build
          # time for no runtime benefit.
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/txme-1mil/openclaw-image:${{ steps.tag.outputs.value }}
            ghcr.io/txme-1mil/openclaw-image:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
